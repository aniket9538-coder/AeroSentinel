version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aerosentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aerosentinel}
      POSTGRES_USER: ${POSTGRES_USER:-aerosentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aerosentinel_user} -d ${POSTGRES_DB:-aerosentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aerosentinel-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../infrastructure/docker/ai.Dockerfile
    container_name: aerosentinel-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aerosentinel-net

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: aerosentinel-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aerosentinel}
      - DATABASE_USERNAME=${POSTGRES_USER:-aerosentinel_user}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-change_this_in_production}
      - AI_SERVICE_URL=http://ai-service:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - aerosentinel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: aerosentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - aerosentinel-net

volumes:
  postgres_data:
    driver: local

networks:
  aerosentinel-net:
    driver: bridge
