server:
  port: ${PORT:8080}

spring:
  application:
    name: aerosentinel-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:10000}
  external:
    cpcb:
      base-url: ${CPCB_BASE_URL:https://api.cpcb.gov.in}
      api-key: ${CPCB_API_KEY:}
    firms:
      base-url: ${FIRMS_BASE_URL:https://firms.modaps.eosdis.nasa.gov}
      api-key: ${FIRMS_API_KEY:}
    weather:
      base-url: ${WEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}
      api-key: ${WEATHER_API_KEY:}
